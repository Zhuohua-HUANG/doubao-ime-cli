<body>
  <h1>安装完成</h1>
  <p>请点击右上角“豆包 Voice CLI”麦克风图标，确认两个快捷键与豆包输入法设置一致。</p>
  <p>常用命令：</p>
  <pre><code>doubao-voice inspect
doubao-voice
doubao-voice handsfree
doubao-voice hold --duration-ms 5000</code></pre>
  <p>英文输出：</p>
  <pre><code>doubao-voice inspect --lang en</code></pre>
