<body>
  <h1>豆包输入法 CLI</h1>
  <p>这个安装包会安装 <code>doubao-voice</code> 和右上角菜单栏助手“豆包 Voice CLI”，用于从命令行或 Agent 触发豆包输入法的语音输入。</p>
  <p>菜单栏助手可以设置免按模式和长按模式两个快捷键，并复制给 Agent 使用的 CLI 说明。</p>
  <p>默认语言为简体中文。英文文档会一并安装，CLI 也支持 <code>--lang en</code>。</p>
</body>
</html>
